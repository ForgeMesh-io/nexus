name: ci

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r docker/requirements.lock
      - run: python -m pytest -q
      - run: python -m forgemesh check-config .
      - name: Check Rust tooling
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          cargo +1.96.0 fmt --all --check
          cargo +1.96.0 test --locked --profile fast
          cargo +1.96.0 clippy --locked --profile fast --all-targets -- -D warnings
          cargo +1.96.0 run --locked --profile fast -- check-config .
      - name: actionlint
        run: |
          curl -fsSL -o /tmp/al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml templates/swarm/.github/workflows/*.yml
