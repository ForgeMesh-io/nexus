name: ci

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r docker/requirements.lock
      - run: python -m pytest -q
      - run: python -m forgemesh check-config .
      - name: Test MCP from the installed wheel
        shell: bash
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/nexus-wheel.XXXXXX")
          python -I -m pip wheel --no-deps --wheel-dir "$scratch" .
          wheels=("$scratch"/forgemesh_nexus-*.whl)
          python -I -m venv "$scratch/venv"
          cd "$scratch"
          ./venv/bin/python -I -m pip install --require-hashes --no-deps -r "$GITHUB_WORKSPACE/docker/requirements.lock"
          ./venv/bin/python -I -m pip install --only-binary=:all: "${wheels[0]}[mcp]"
          ./venv/bin/python -I -m pip check
          ./venv/bin/python -I - <<'PY'
          from pathlib import Path
          from sysconfig import get_path
          import mcp
          from forgemesh import pilot_mcp

          for module in (mcp, pilot_mcp):
              path = Path(module.__file__).resolve()
              assert path.is_relative_to(Path(get_path("purelib")).resolve()), path
              print(f"Testing installed {module.__name__}: {path}")
          PY
          # Bubblewrap variants require a separately configured host.
          ./venv/bin/python -I -m pytest -v -rs --import-mode=importlib -p no:cacheprovider \
            -m 'not mcp_os_isolation' --junitxml=mcp.xml "$GITHUB_WORKSPACE/tests/test_pilot_mcp.py"
          ./venv/bin/python -I - <<'PY'
          from xml.etree.ElementTree import parse

          cases = parse("mcp.xml").findall(".//testcase")
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Expected MCP tests to run without skips or expected failures")
          PY
      - name: actionlint
        run: |
          curl -fsSL -o /tmp/al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml templates/swarm/.github/workflows/*.yml
