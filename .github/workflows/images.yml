# Builds the official images on the trusted runner, pushes them to GHCR and
# publishes signed build provenance (Sigstore). Only runs for tags pushed by
# maintainers (protect `v*` tags with a ruleset). Swarm manifests then pin the
# resulting digests; participants verify with:
#   gh attestation verify oci://ghcr.io/forgemesh-io/base@sha256:... --owner ForgeMesh-io \
#     --signer-workflow ForgeMesh-io/nexus/.github/workflows/images.yml
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release        # requires a maintainer approval (configure reviewers on the environment)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/base.Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/forgemesh-io/base:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/forgemesh-io/base
          subject-digest: ${{ steps.base.outputs.digest }}
          push-to-registry: true
      - id: nexus
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/nexus.Dockerfile
          push: true
          provenance: false
          build-args: BASE=ghcr.io/forgemesh-io/base@${{ steps.base.outputs.digest }}
          tags: ghcr.io/forgemesh-io/nexus:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/forgemesh-io/nexus
          subject-digest: ${{ steps.nexus.outputs.digest }}
          push-to-registry: true
      - id: vie
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/vie.Dockerfile
          push: true
          provenance: false
          build-args: BASE=ghcr.io/forgemesh-io/base@${{ steps.base.outputs.digest }}
          tags: ghcr.io/forgemesh-io/vie:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/forgemesh-io/vie
          subject-digest: ${{ steps.vie.outputs.digest }}
          push-to-registry: true
      - id: orbis
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/orbis.Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/forgemesh-io/orbis:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/forgemesh-io/orbis
          subject-digest: ${{ steps.orbis.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          BASE: ${{ steps.base.outputs.digest }}
          NEXUS: ${{ steps.nexus.outputs.digest }}
          VIE: ${{ steps.vie.outputs.digest }}
          ORBIS: ${{ steps.orbis.outputs.digest }}
        run: |
          {
            echo "ghcr.io/forgemesh-io/base@${BASE}"
            echo "ghcr.io/forgemesh-io/nexus@${NEXUS}"
            echo "ghcr.io/forgemesh-io/vie@${VIE}"
            echo "ghcr.io/forgemesh-io/orbis@${ORBIS}"
          } >> "$GITHUB_STEP_SUMMARY"
